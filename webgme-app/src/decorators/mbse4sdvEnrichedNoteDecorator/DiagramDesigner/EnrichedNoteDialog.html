<div class="enriched-note-editor-dialog modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xlg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">&times;</button>
                <h3 id="dialog-title">Edit Enriched Note</h3>
            </div>
            <form class="modal-body form-horizontal" role="form">
                <div class="control-group" id="pName">
                    <label>Name: </label>
                    <input type="text" class="form-control" id="pNameField" placeholder="Name" />
                </div>
                <div class="control-group" id="pDescription">
                    <label>Description: </label>

                    <div class="enriched-note-toolbar btn-toolbar" role="toolbar">
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-default" data-cmd="bold" title="Bold"><i class="fa fa-bold"></i></button>
                            <button type="button" class="btn btn-default" data-cmd="italic" title="Italic"><i class="fa fa-italic"></i></button>
                            <button type="button" class="btn btn-default" data-cmd="underline" title="Underline"><i class="fa fa-underline"></i></button>
                            <button type="button" class="btn btn-default" data-cmd="strikeThrough" title="Strikethrough"><i class="fa fa-strikethrough"></i></button>
                        </div>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-default" data-cmd="formatBlock" data-value="H1" title="Heading 1">H1</button>
                            <button type="button" class="btn btn-default" data-cmd="formatBlock" data-value="H2" title="Heading 2">H2</button>
                            <button type="button" class="btn btn-default" data-cmd="formatBlock" data-value="P" title="Paragraph">&para;</button>
                        </div>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-default" data-cmd="insertUnorderedList" title="Bullet list"><i class="fa fa-list-ul"></i></button>
                            <button type="button" class="btn btn-default" data-cmd="insertOrderedList" title="Numbered list"><i class="fa fa-list-ol"></i></button>
                        </div>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-default" data-action="link" title="Insert link"><i class="fa fa-link"></i></button>
                            <button type="button" class="btn btn-default" data-action="image" title="Insert image"><i class="fa fa-picture-o"></i></button>
                        </div>
                        <div class="btn-group btn-group-sm" role="group">
                            <button type="button" class="btn btn-default" data-cmd="removeFormat" title="Clear formatting"><i class="fa fa-eraser"></i></button>
                        </div>
                        <span class="enriched-note-upload-status text-muted"></span>
                        <input type="file" class="enriched-note-image-input" accept="image/*" style="display:none" />
                    </div>

                    <div class="form-control enriched-note-editor" id="pDescriptionEditor" contenteditable="true"></div>
                </div>
            </form>
            <div class="modal-footer">
                <a href="#" class="btn btn-primary btn-save">Save</a>
                <a href="#" class="btn btn-default" data-dismiss="modal">Cancel</a>
            </div>
        </div>
    </div>
</div>
