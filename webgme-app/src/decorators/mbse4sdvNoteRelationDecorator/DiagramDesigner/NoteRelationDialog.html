<div class="meta-text-editor-dialog modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xlg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal">×</button>
                <h3 id="dialog-title">Edit Note</h3>
            </div>
            <form class="modal-body form-horizontal" role="form">
                <div class="control-group" id="pName">
                    <label>Name: </label>
                    <input type="text" class="form-control" id="pNameField" placeholder="Name" />
                </div>
                <div class="control-group" id="pDescription">
                    <label>Description: </label>
                    <textarea type="text" class="form-control" id="pDescriptionField" placeholder="Description" />
                </div>
            </form>
            <div class="modal-footer">
                <a href="#" class="btn btn-primary btn-save">Save</a>
                <a href="#" class="btn btn-default" data-dismiss="modal">Cancel</a>
            </div>
        </div>
    </div>
</div>
